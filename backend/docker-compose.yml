services:
  postgres:
    image: postgres:16-alpine
    container_name: praxis-postgres
    environment:
      POSTGRES_USER: praxis
      POSTGRES_PASSWORD: praxis
      POSTGRES_DB: praxis
    ports:
      - "5432:5432"
    volumes:
      - praxis_pg_data:/var/lib/postgresql/data
      # Los .sql de aqui se ejecutan en orden alfabetico la primera vez
      # que se crea el volumen (crea las tablas + inserta el artifact inicial).
      - ./db/init:/docker-entrypoint-initdb.d:ro

volumes:
  praxis_pg_data:
